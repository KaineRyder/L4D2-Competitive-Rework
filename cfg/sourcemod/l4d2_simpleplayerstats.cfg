// 启用插件
pstats_enabled 1

// 显示调试信息（可关闭）
pstats_debug_enabled 0

// 仅在对抗模式生效（你可以改为 0 让它在所有模式生效）
pstats_versus_exclusive 0

// 是否记录机器人数据
pstats_record_bots 0

// 玩家面板超时时间（秒）
pstats_menu_timeout 30

// 显示前 N 名玩家
pstats_max_top_players 10

// 启用额外统计项（如果你配置了 extra stats）
pstats_extras_enabled 1

// 显示内容类型：1=点数，2=数量，3=两者
pstats_display_type 3

// 玩家加入地图时显示其排名
pstats_show_rank_onjoin 1

// 加入提示是否显示到聊天
pstats_cannounce_enabled 1
