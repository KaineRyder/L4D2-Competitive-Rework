// 0=關閉插件, 1=啟動插件
lmc_blackandwhite "1"

// 為1時，黑白玩家有光圈效果
lmc_glow "1"

// 光圈的顏色，填入RGB三色 (三個數值介於0~255，需要空格) [-1: 隨機顏色]
lmc_glowcolour "89 55 37"

// 光圈最遠可見範圍
lmc_glowrange "800.0"

// 黑白玩家生命值低於此數值時，光圈開始閃爍 (0 = 關閉這項功能)
lmc_glowflash "20"

// 黑白提示該如何顯示. (0: 不提示, 1: 聊天框, 2: 黑底白字框, 3: 導演系統提示-玩家需要開啟遊戲指導系統)
lmc_noticetype "2"

// 提示給誰看? (0=倖存者隊伍, 1=特感隊伍, 2=所有玩家)
lmc_teamnoticetype "0"

// 導演系統提示的範圍
lmc_hintrange "600"

// 導演系統提示的時間 (單位: 秒)
lmc_hinttime "5.0"

// 導演系統提示的顏色
lmc_hintcolour "255 0 0"