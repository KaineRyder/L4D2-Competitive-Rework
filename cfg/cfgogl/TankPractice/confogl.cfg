// ReadyUp Cvars
l4d_ready_cfg_name "Tank Practice"

// Confogl Cvars
confogl_addcvar mp_gamemode "versus"  // Force Versus for the config.
confogl_addcvar z_difficulty "normal" // Force normal Difficulty to prevent co-op difficulty impacting the config.
confogl_addcvar confogl_pills_limit 0 // Limits the number of pain pills on each map outside of saferooms. -1: no limit; >=0: limit to cvar value

// ZoneMod 1v1 Cvars
confogl_addcvar z_common_limit 0
confogl_addcvar survivor_limit 0
confogl_addcvar z_max_player_zombies 1
confogl_addcvar z_versus_hunter_limit 1
confogl_addcvar z_versus_boomer_limit 0
confogl_addcvar z_versus_smoker_limit 0
confogl_addcvar z_versus_jockey_limit 1
confogl_addcvar z_versus_charger_limit 0
confogl_addcvar z_versus_spitter_limit 0
confogl_addcvar z_mega_mob_size 12
confogl_addcvar z_ghost_delay_min 1
confogl_addcvar z_ghost_delay_max 1
confogl_addcvar z_ghost_delay_minspawn 1
confogl_addcvar z_mob_spawn_min_size 0
confogl_addcvar z_mob_spawn_max_size 0
confogl_addcvar z_mob_spawn_min_interval_normal 36000
confogl_addcvar z_mob_spawn_max_interval_normal 36000
confogl_addcvar z_pounce_damage 24
confogl_addcvar z_jockey_ride_damage 24
confogl_addcvar hunter_pz_claw_dmg 0
confogl_addcvar jockey_pz_claw_dmg 0
confogl_addcvar survivor_ledge_grab_health 0
confogl_addcvar survivor_max_incapacitated_count 3
confogl_addcvar versus_tank_flow_team_variation 0
confogl_addcvar versus_boss_flow_max 0.06
confogl_addcvar versus_boss_flow_min 0.05
confogl_addcvar tank_stuck_time_suicide 999999999
confogl_addcvar tank_stuck_visibility_tolerance_suicide 999999999
confogl_addcvar tank_visibility_tolerance_suicide 999999999
confogl_addcvar director_tank_lottery_selection_time 3
confogl_addcvar z_frustration_spawn_delay 999999999
confogl_addcvar z_frustration_los_delay 99999999
sm_cvar z_frustration_lifetime 999999
confogl_addcvar tankcontrol_print_all 1
confogl_addcvar tank_ground_pound_duration 0.1
sm_cvar sb_stop 1
sm_cvar director_no_death_check 1
sm_cvar versus_force_start_time 5
// No tank, witch only
confogl_addcvar versus_tank_chance 1
confogl_addcvar versus_tank_chance_finale 1
confogl_addcvar versus_tank_chance_intro 1
confogl_addcvar versus_witch_chance 0
confogl_addcvar versus_witch_chance_finale 0
confogl_addcvar versus_witch_chance_intro 0

// ZoneMod Shared Cvars
exec cfgogl/zonemod/shared_cvars.cfg

// Plugin Cvars
exec cfgogl/TankPractice/TankPractice.cfg