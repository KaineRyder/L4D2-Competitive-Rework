// ReadyUp Cvars
l4d_ready_cfg_name "FDreamMod v1.0.1"

// Confogl Cvars
confogl_addcvar mp_gamemode "versus"                  // 游戏模式
confogl_addcvar z_difficulty "normal"                 // 游戏难度
confogl_addcvar confogl_pills_limit 2                 // 限制每张地图安全屋外止痛药生成数量上限，-1无限制，>=0即是Cvars限制
confogl_addcvar confogl_adrenaline_limit 0            // 限制每张地图安全屋外肾上腺素生成数量上限，-1无限制，>=0即是Cvars限制
confogl_addcvar confogl_vomitjar_limit 0              // 限制每张地图安全屋外胆汁瓶生成数量上限，-1无限制，>=0即是Cvars限制
confogl_addcvar confogl_molotov_limit 1               // 限制每张地图安全屋外燃烧瓶生成数量上限，-1无限制，>=0即是Cvars限制
confogl_addcvar confogl_defibrillator_limit 1                 // 限制每张地图安全屋外除颤器生成数量上限，-1无限制，>=0即是Cvars限制

// FDreamMod 4v4 Cvars
confogl_addcvar z_common_limit 30
confogl_addcvar z_ghost_delay_min 16
confogl_addcvar z_ghost_delay_max 16
confogl_addcvar z_mega_mob_size 50
confogl_addcvar z_mob_spawn_min_size 15
confogl_addcvar z_mob_spawn_max_size 15
confogl_addcvar z_mob_spawn_min_interval_normal 3600
confogl_addcvar z_mob_spawn_max_interval_normal 3600
confogl_addcvar z_pounce_damage 2
confogl_addcvar z_pounce_damage_interval 0.2
confogl_addcvar z_jockey_ride_damage 1
confogl_addcvar z_jockey_ride_damage_interval 0.2
confogl_addcvar hunter_pz_claw_dmg 6
confogl_addcvar charger_pz_claw_dmg 7

// [l4d2_smoker_drag_damage_interval.smx]
confogl_addcvar tongue_drag_damage_amount 1
confogl_addcvar tongue_choke_damage_amount 1
confogl_addcvar tongue_drag_first_damage_interval 1.0
confogl_addcvar tongue_drag_first_damage 3
confogl_addcvar tongue_drag_damage_interval 0.2
confogl_addcvar tongue_choke_damage_interval 0.2

// FDreamMod Shared Cvars
exec cfgogl/fdream/shared_cvars.cfg

// Config Cvars
exec cfgogl/fdream/fdream.cfg